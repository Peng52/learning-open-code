# broker所属集群的名称
brokerClusterName = DefaultCluster
# broker的名称
brokerName = broker-aaaaaaaaaa
# broker的ID, 0表示Master，非0表示Slave
brokerId = 0
# 删除文件时间点,默认是凌晨4点
deleteWhen = 04
# 文件保留时间,默认保留48小时
fileReservedTime = 48
# broker的角色
# ASYNC_MASTER: 异步复制Master
# SYNC_MASTER: 同步双写Master
# SLAVE: slave
brokerRole = ASYNC_MASTER

# 刷盘方式
# ASYNC_FLUSH: 异步刷盘
# SYNC_FLUSH: 同步刷盘
flushDiskType = ASYNC_FLUSH
# 是否允许broker自动创建Topic
autoCreateTopicEnable=true

# NameServer的地址，如果有多个的话，使用分号分隔开
namesrvAddr=127.0.0.1:9876

# 当前broker监听的IP地址
#brokerIP1=10.0.90.59

# 在发送消息时，自动创建服务器不存在的topic，默认创建4个队列
defaultTopicQueueNums=4

#是否允许broker自动创建订阅组
autoCreateSubscriptionGroup=true
# broker对外服务的监听端口
listenPort=10911
# 每个commitLog文件的大小默认是1G
mapedFileSizeCommitLog=1073741824
# ConsumeQueue每个文件默认存30W条
mapedFileSizeConsumeQueue=300000
# store的存储路径
storePathRootDir=G:\\learn-proj\\rocketmq\\rocket_home\\store

# commitLog的存储路径
storePathCommitLog=G:\\learn-proj\\rocketmq\\rocket_home\\store\\commitlog

# 消费队列的存储路径
storePathConsumeQueue=G:\\learn-proj\\rocketmq\\rocket_home\\store\\consumequeue

# 消息索引的存储路径
storePathIndex=G:\\learn-proj\\rocketmq\\rocket_home\\store\\index

# checkpoint文件的存储路径
storeCheckpoint=G:\\learn-proj\\rocketmq\\rocket_home\\store\\checkpoint

# abort文件的存储路径
abortFile=G:\\learn-proj\\rocketmq\\rocket_home\\store\\abort

# 限制的消息大小,默认为4M
maxMessageSize=65536

# 检测物理文件磁盘空间
diskMaxUsedSpaceRatio=75
